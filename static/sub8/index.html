# Panoptikum.social

... das Social Podcasting Network,<br/>
das wir haben möchten!

---
class: center, middle

# Motivation

---

# Was kann Panoptikum derzeit?

einfacher zu verstehen, kennt man das Datenmodell ...
---
# Das Datenmodell

```
Podcasts (1:n) Feeds    (1:n) alternative Feeds

         (1:n) Episoden (1:n) Kapitel
                        (1:n) Enclosures (= Soundfiles)
                        (n:m) Kontributoren (= Podcaster_innen)

         (n:1) Sprachen
         (n:m) Kategorien (in Baumstruktur)

         (n:m) Besitzer (1:1) Besucher
         (n:m) Kontributoren (= Podcaster_innen = Besucher)
         (n:m) Follower (= User)
         (n:m) Hörer (= User)

Besucher (n:m) Follower (= User)
```
---
# Features

* Kategorienbaum mit Podcasts
* Podcasts mit Episoden
* Datenbestand<br/>
  ... 102 Podcasts<br/>
  ... 5750 Episoden<br/>
  ... 46 Kategorien
* Parser<br/>
  ... liest Feeds und befüllt Datenbank
* Podlove Webplayer
* Scan to subscribe<br/>
  ... per QR-Code
* responsive Layout
* Antwortzeiten unter 25ms

---

# Roadmap

* Subscribe 08 (Oktober 2016)<br/>
  Öffentliche Alpha ✓

* 33C3 (Weihnachten 2016):<br/>
  Öffentliche Beta

* Mitte 2017: Produktivstart

---
# Themen

Features nächste Folie ...

* Lernen und Aufräumen
* Security
* Privacy
* Parallelisieren
* Messaging</br> 
  ...aka Likes, Kommentare, Empfehlungen,... </br> 
  ...incl. API

---
# Features Public Beta?

* Kommentare<br/>
  ... pro Podcast, pro Episode<br/>
  ... erzeugen Nachrichten
* Nachrichten<br/>
  ...an Benutzer, an Besitzer
* Nachrichtenkanäle<br/>
  ... abbonierbar, pro Benutzer, Podcast, Episode
  * Likes<br/>
  ... um zu folgen<br/>
  ... um zu vergleichen
* User wie Du<br/>
  ... hören auch<br/>
  ... mögen
